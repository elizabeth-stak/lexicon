<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexicon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">

    <!-- HOME -->
    <section id="home" class="screen">
      <h1>Lexicon</h1>
      <p class="sub">Learn a word by picking it from multiple choice. Then it joins the timed game.</p>

      <div class="tiers" id="tiers">
        <button data-tier="1">Tier 1</button>
        <button data-tier="2">Tier 2</button>
        <button data-tier="all">Both</button>
      </div>

      <div class="cards">
        <button class="big" id="goLearn">
          <span class="big-title">Learn</span>
          <span class="big-sub" id="learnSub"></span>
        </button>
        <button class="big" id="goPlay">
          <span class="big-title">Play</span>
          <span class="big-sub" id="playSub"></span>
        </button>
      </div>

      <div class="foot">
        <span id="resetWrap"><button class="link" id="resetBtn">Reset progress</button></span>
      </div>
    </section>

    <!-- LEARN -->
    <section id="learn" class="screen hidden">
      <div class="topbar">
        <button class="link" data-home>&larr; Home</button>
        <span class="muted" id="learnCount"></span>
      </div>
      <div class="panel" id="learnPanel"></div>
      <p class="hint-keys">Press <kbd>1</kbd>–<kbd>4</kbd> to choose and <kbd>Enter</kbd> to continue.</p>
    </section>

    <!-- PLAY -->
    <section id="play" class="screen hidden">
      <div class="topbar">
        <button class="link" id="quit">&larr; Quit</button>
        <span class="score">Score <b id="score">0</b></span>
      </div>
      <div class="timer-wrap">
        <div class="timer" id="timer">1:30</div>
        <div class="bonus" id="bonus">+5</div>
      </div>
      <div class="timebar"><div id="timebar"></div></div>

      <div class="panel" id="playPanel">
        <div class="def" id="pDef"></div>
        <div class="starts">starts with <b id="pStart"></b></div>
        <div class="typebox">
          <span class="dot" id="dot"></span>
          <input id="pInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word">
        </div>
      </div>

      <div class="overlay" id="startOverlay">
        <div>
          <p class="ov-title">1:30 on the clock</p>
          <p>+5 seconds for every word you get. <kbd>Esc</kbd> skips.</p>
          <p class="muted">Press <kbd>Enter</kbd> to start</p>
        </div>
      </div>
      <p class="hint-keys"><kbd>Esc</kbd> to skip</p>
    </section>

    <!-- RESULTS -->
    <section id="results" class="screen hidden">
      <div class="topbar">
        <button class="link" data-home>&larr; Home</button>
      </div>
      <div class="result-head">
        <div class="result-score" id="rScore"></div>
        <div class="muted" id="rBest"></div>
      </div>
      <div class="actions">
        <button class="btn" id="again">Play again</button>
        <button class="btn ghost" data-home>Home</button>
      </div>
      <div id="rLists"></div>
      <p class="hint-keys"><kbd>Enter</kbd> to play again</p>
    </section>

  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
