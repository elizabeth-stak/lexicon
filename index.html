<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sesquipedalian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">

    <!-- HOME -->
    <section id="home" class="screen">
      <h1>Sesquipedalian</h1>
      <p class="sub">pick it, type it, keep it.</p>

      <div class="cards">
        <button class="big learn" id="goLearn">
          <span class="big-title">Learn</span>
          <span class="big-sub" id="learnSub"></span>
        </button>
        <button class="big play" id="goPlay">
          <span class="big-title">Play</span>
          <span class="big-sub" id="playSub"></span>
        </button>
      </div>

      <div class="progress-card">
        <div class="progress-top"><span>words collected</span><span id="progNum"></span></div>
        <div class="progress"><div id="progBar"></div></div>
      </div>

      <div class="foot">
        <span id="resetWrap"><button class="link" id="resetBtn">reset progress</button></span>
      </div>
    </section>

    <!-- LEARN -->
    <section id="learn" class="screen hidden">
      <div class="topbar">
        <button class="pill-btn" data-home>&larr; home</button>
        <span class="count" id="learnCount"></span>
      </div>
      <div class="panel" id="learnPanel"></div>
      <p class="hint-keys"><kbd>1</kbd>–<kbd>4</kbd> to choose</p>
    </section>

    <!-- PLAY -->
    <section id="play" class="screen hidden">
      <div class="topbar">
        <button class="pill-btn" id="quit">&larr; quit</button>
        <span class="score-pill">score <b id="score">0</b></span>
      </div>
      <div class="timer-wrap">
        <div class="timer" id="timer">1:30</div>
        <div class="bonus" id="bonus">+5s</div>
      </div>
      <div class="timebar"><div id="timebar"></div></div>

      <div class="panel" id="playPanel">
        <div class="def" id="pDef"></div>
        <div class="starts">starts with <span class="letter" id="pStart"></span><span class="len" id="pLen"></span></div>
        <div class="typebox">
          <span class="dot" id="dot"></span>
          <input id="pInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word…">
        </div>
        <div class="reveal hidden" id="reveal"></div>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="ov-card">
          <p class="ov-title">ready?</p>
          <p>1:30 on the clock · <b>+5s</b> per word · <kbd>Esc</kbd> skips and shows the answer</p>
          <p class="ov-go">press <kbd>Enter</kbd> to start</p>
        </div>
      </div>
      <p class="hint-keys"><kbd>Esc</kbd> to skip</p>
    </section>

    <!-- RESULTS -->
    <section id="results" class="screen hidden">
      <div class="topbar">
        <button class="pill-btn" data-home>&larr; home</button>
      </div>
      <div class="result-head">
        <div class="result-label">you got</div>
        <div class="result-score" id="rScore"></div>
        <div class="result-best" id="rBest"></div>
      </div>
      <div class="actions">
        <button class="btn" id="again">play again</button>
        <button class="btn ghost" data-home>home</button>
      </div>
      <div id="rLists"></div>
      <p class="hint-keys"><kbd>Enter</kbd> to play again</p>
    </section>

  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
